  <!-- GCash Header Title -->
  <text x="200" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    GCash
  </text>
  <text x="200" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E0EFFF" text-anchor="middle" letter-spacing="2">
    SCAN TO PAY • AQUA B STATION
  </text>

  <!-- QR Code Container Box -->
  <rect x="50" y="130" width="300" height="300" rx="24" fill="#ffffff" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Simulated Crisp QR Code Pattern -->
